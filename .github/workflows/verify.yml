name: Verify weighbridge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create credential-free package
        shell: powershell
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: QabanAlGhad-Windows
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QabanAlGhad-TestTools
          path: out/*
  http-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official Ubuntu Mono packages
        run: sudo apt-get update && sudo apt-get install -y mono-devel
      - name: Run all local protocol and HTTP checks
        run: bash scripts/test-mono.sh
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, http-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-weighbridge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: QabanAlGhad-Windows
          path: release-package
      - name: Publish tested Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            if [ "$(jq -r '.isDraft' release-state.json)" = false ]; then
              echo 'Version already published; increment VERSION to publish a new update.'
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "قبان الغد $version" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$tag" release-package/*.zip --clobber
          gh release edit "$tag" --draft=false --latest
  online-upgrade:
    needs: [publish]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: QabanAlGhad-TestTools
          path: update-test-tools
      - name: Upgrade previous published package using the live update client
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content VERSION -Raw).Trim() -eq '0.10.0') { exit 0 }
          New-Item -ItemType Directory previous | Out-Null
          gh release download v0.10.0 --pattern QabanAlGhad-0.10.0.zip --dir previous
          if ($LASTEXITCODE -ne 0) { throw 'Previous public package download failed.' }
          Expand-Archive previous/QabanAlGhad-0.10.0.zip previous/runtime
          $installed = (Resolve-Path previous/runtime/QabanAlGhad-0.10.0).Path
          & ./update-test-tools/QabanAlGhad.Tests.exe --online-lifecycle $installed
          if ($LASTEXITCODE -ne 0) { throw 'Live online upgrade failed.' }
